java_home: "/usr/lib/jvm/java-11-openjdk-amd64"

# Vagrant reads these values and generates inventory/hosts.yml.
vagrant_box: "ubuntu/jammy64"
vagrant_box_version:
vagrant_vm_name_prefix: "hadoop-ha"
vagrant_vm_memory_mb: 2048
vagrant_vm_cpus: 2
hadoop_host_addresses:
  nn1: "10.0.0.111"
  nn2: "10.0.0.112"
  dn1: "10.0.0.113"
  dn2: "10.0.0.114"
  client: "10.0.0.115"
vagrant_vm_specs:
  - name: "nn1"
    groups: ["namenodes", "journalnodes", "zookeepers"]
    zk_id: 1
  - name: "nn2"
    groups: ["namenodes", "zookeepers"]
    zk_id: 2
  - name: "dn1"
    groups: ["datanodes", "journalnodes", "zookeepers"]
    zk_id: 3
  - name: "dn2"
    groups: ["datanodes", "journalnodes"]
  - name: "client"
    groups: ["clients"]

ansible_user: root

hadoop_version: "3.3.6"
hadoop_home: "/opt/hadoop"
hadoop_conf_dir: "{{ hadoop_home }}/etc/hadoop"

zk_version: "3.8.4"
zk_home: "/opt/zookeeper"
zk_data_dir: "/var/lib/zookeeper"
zk_conf_dir: "{{ zk_home }}/conf"

fs_default: "hdfs://mycluster"
nameservice_id: "mycluster"
dfs_ha_namenodes: ["nn1","nn2"]
dfs_namenode_rpc_address:
  nn1: "nn1:8020"
  nn2: "nn2:8020"
dfs_namenode_http_address:
  nn1: "nn1:9870"
  nn2: "nn2:9870"
dfs_journalnode_edits_dir: "/opt/hadoop/data/jn"
dfs_replication: 2
dfs_namenode_name_dir: "/opt/hadoop/data/namenode"
dfs_datanode_data_dir: "/opt/hadoop/data/datanode"

yarn_resourcemanager_hostname:
  nn1: "nn1"
  nn2: "nn2"
yarn_resourcemanager_address:
  nn1: "nn1:8032"
  nn2: "nn2:8032"
yarn_resourcemanager_scheduler_address:
  nn1: "nn1:8030"
  nn2: "nn2:8030"
yarn_resourcemanager_resource_tracker_address:
  nn1: "nn1:8031"
  nn2: "nn2:8031"
yarn_resourcemanager_admin_address:
  nn1: "nn1:8033"
  nn2: "nn2:8033"
yarn_resourcemanager_webapp_address:
  nn1: "nn1:8088"
  nn2: "nn2:8088"
