---
- name: Create the ZooKeeper user
  user:
    name: zookeeper
    system: yes
    create_home: no

- name: Extract the ZooKeeper package
  unarchive:
    src: "apache-zookeeper-{{ zk_version }}-bin.tar.gz"
    dest: /opt
    owner: zookeeper
    group: zookeeper
  when: inventory_hostname in groups['zookeepers']

- name: Create the symbolic link
  file:
    src: "/opt/apache-zookeeper-{{ zk_version }}-bin"
    dest: "{{ zk_home }}"
    state: link
    owner: zookeeper
    group: zookeeper

- name: Create the data directory
  file:
    path: "{{ zk_data_dir }}"
    state: directory
    owner: zookeeper
    group: zookeeper

- name: Generate myid
  copy:
    content: "{{ zk_id }}"
    dest: "{{ zk_data_dir }}/myid"
    owner: zookeeper
    group: zookeeper
  when: zk_id is defined

- name: Configure zoo.cfg
  template:
    src: zoo.cfg.j2
    dest: "{{ zk_conf_dir }}/zoo.cfg"
    owner: zookeeper
    group: zookeeper

- name: Install the ZooKeeper service
  template:
    src: zookeeper.service.j2
    dest: /etc/systemd/system/zookeeper.service

- name: Start and enable ZooKeeper
  systemd:
    name: zookeeper
    state: started
    enabled: yes
    daemon_reload: yes
